name: Purchase request response

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  respond:
    if: contains(github.event.issue.labels.*.name, 'purchase-request') || contains(github.event.issue.labels.*.name, 'service-request')
    runs-on: ubuntu-latest
    steps:
      - name: Add buyer guidance
        uses: actions/github-script@v7
        with:
          script: |
            const isService = context.payload.issue.labels.some((label) => label.name === 'service-request');
            const marker = isService ? '<!-- service-request-auto-reply -->' : '<!-- purchase-request-auto-reply -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            if (comments.some((comment) => comment.body && comment.body.includes(marker))) {
              return;
            }
            const body = isService
              ? `${marker}
Thanks for your custom setup request.

Starter price: EUR 79

Do not post passwords, bank details, tax IDs, card details, or private payment information in this public issue.

Next step: a private payment/checkout path needs to be connected before work can begin. Once payment is confirmed, the setup can be scoped from the public-friendly details in this issue and any private details shared through an agreed private channel.

Preview page: https://albercr3.github.io/freelancer-profit-planner/`
              : `${marker}
Thanks for your interest in Freelancer Profit Planner.

Price: EUR 12

Do not post passwords, bank details, tax IDs, card details, or private payment information in this public issue.

The checkout link is being connected. Once payment is confirmed through PayPal, Stripe, Ko-fi, Payhip, or another agreed checkout method, the paid ZIP can be delivered directly.

Preview page: https://albercr3.github.io/freelancer-profit-planner/`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
